name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Compact compiler
        run: |
          curl -fsSL https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh -o /tmp/compact-installer.sh
          bash /tmp/compact-installer.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Not optional: the installer script only fetches the CLI wrapper, not the
      # toolchain binary itself. Without `compact update`, every subsequent
      # `compact compile` fails with "No default compiler set".
      - name: Download Compact toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact update

      - name: Verify Compact version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact --version

      - name: Compile sealedquote contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/sealedquote.compact managed/sealedquote

      - name: Run test suite
        run: node --experimental-vm-modules node_modules/.bin/jest --testPathPattern=tests/ --forceExit

      - name: Build frontend
        run: npm run build
